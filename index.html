        </div>
        <div className="grid">
          {allItems.map(item=>{
            const owned=inv.some(i=>i.id===item.id);
            return(
              <div key={item.id} className="grid-item">
                {owned&&<div className="grid-item-badge">Куплено</div>}
                <img src={item.image} alt="" className="grid-item-img"/>
                <div className="grid-item-name">{item.name}</div>
                <div className="grid-item-price"><Diamond/>{item.price}</div>
                {!owned&&<button className="btn btn-primary btn-xs f1" style={{marginTop:8}} onClick={()=>purchase(item)}>Купить</button>}
              </div>
            );
          })}
        </div>
      </>)}
      {mainTab==='workshop'&&(<>
        <div className="tabs" style={{marginBottom:20}}>
          <button className={`tab ${workshopCat==='frames'?'on':''}`} onClick={()=>setWorkshopCat('frames')}>Рамки</button>
          <button className={`tab ${workshopCat==='backgrounds'?'on':''}`} onClick={()=>setWorkshopCat('backgrounds')}>Фоны</button>
          <button className={`tab ${workshopCat==='my'?'on':''}`} onClick={()=>setWorkshopCat('my')}>Мои фоны</button>
        </div>
        <div style={{marginBottom:20,padding:20,background:'var(--bg-elev-1)',borderRadius:'var(--r-lg)',textAlign:'center',position:'relative',overflow:'hidden'}}>
          {previewBg?.image&&<div style={{position:'absolute',inset:0,backgroundImage:`url(${previewBg.image})`,backgroundSize:'cover',backgroundPosition:'center',opacity:.3}}/>}
          <div style={{position:'relative',zIndex:1}}>
            <AvSquare src={profile.avatar} size={100} frame={previewFrame} username={profile.username}/>
            <div style={{fontWeight:700,fontSize:18,marginTop:12}}>{profile.username}</div>
            <div style={{fontSize:13,color:'var(--t-lo)',marginTop:4}}>@{profile.user}</div>
          </div>
        </div>
        {workshopCat==='frames'&&(<div className="grid">
          {[...FRAMES,...u.toArr(profile?.inventory).filter(i=>i.type==='frame')].map((item,idx)=>{
            const owned=inv.some(i=>i.id===item.id);
            const isEquipped=previewFrame?.id===item.id;
            return(
              <div key={item.id+idx} className="grid-item" style={{border:isEquipped?'2px solid var(--accent)':'1px solid var(--glass-border)'}}>
                <img src={item.image} alt="" className="grid-item-img"/>
                <div className="grid-item-name">{item.name}</div>
                {owned?(<button className={`btn ${isEquipped?'btn-success':'btn-primary'} btn-xs f1`} style={{marginTop:8}} onClick={()=>equipFrame(isEquipped?null:item)}>{isEquipped?'Снять':'Надеть'}</button>):(<div style={{fontSize:11,color:'var(--t-faint)',marginTop:8}}>Не куплено</div>)}
              </div>
            );
          })}
        </div>)}
        {workshopCat==='backgrounds'&&(<div className="grid">
          {[...BACKGROUNDS,...u.toArr(profile?.inventory).filter(i=>i.type==='background')].map((item,idx)=>{
            const owned=inv.some(i=>i.id===item.id);
            const isEquipped=previewBg?.id===item.id;
            return(
              <div key={item.id+idx} className="grid-item" style={{border:isEquipped?'2px solid var(--accent)':'1px solid var(--glass-border)'}}>
                <img src={item.image} alt="" className="grid-item-img"/>
                <div className="grid-item-name">{item.name}</div>
                {owned?(<button className={`btn ${isEquipped?'btn-success':'btn-primary'} btn-xs f1`} style={{marginTop:8}} onClick={()=>equipBg(isEquipped?null:item)}>{isEquipped?'Снять':'Надеть'}</button>):(<div style={{fontSize:11,color:'var(--t-faint)',marginTop:8}}>Не куплено</div>)}
              </div>
            );
          })}
        </div>)}
        {workshopCat==='my'&&(<div>
          <div style={{display:'flex',gap:10,marginBottom:16}}>
            <button className="btn btn-primary f1" onClick={openDrawBg}><Icon name="brush" size={18}/> Нарисовать фон (250💎)</button>
            <label className="btn btn-secondary f1" style={{cursor:'pointer',justifyContent:'center'}}><Icon name="upload" size={18}/> Загрузить фон (750💎)<input type="file" accept="image/*" hidden onChange={purchaseUploadBg}/></label>
          </div>
          {myBackgrounds.length===0?(
            <div style={{textAlign:'center',padding:30,color:'var(--t-faint)'}}>Нет своих фонов</div>
          ):(
            <div className="grid">
              {myBackgrounds.map(bg=>{
                const isEquipped=previewBg?.id===bg.id;
                return(
                  <div key={bg.id} className="grid-item" style={{border:isEquipped?'2px solid var(--accent)':'1px solid var(--glass-border)'}}>
                    <img src={bg.image} alt="" className="grid-item-img"/>
                    <div className="grid-item-name">{bg.name||'Мой фон'}</div>
                    <button className={`btn ${isEquipped?'btn-success':'btn-primary'} btn-xs f1`} style={{marginTop:8}} onClick={()=>equipBg(isEquipped?null:bg)}>{isEquipped?'Снять':'Надеть'}</button>
                    <button className="btn btn-danger btn-xs f1" style={{marginTop:4}} onClick={()=>deleteMyBg(bg.id)}>Удалить</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>)}
      </>)}
    </Mdl>
    <BgEditor open={showBgEditor} onClose={()=>setShowBgEditor(false)} onSave={onSaveBgEditor}/>
    </>
  );
}

/* ===== CREATE / JOIN ===== */
function CreateModal({open,onClose,onCreated}){
  if(!open)return null;
  return(
    <Mdl open={open} onClose={onClose} title="Что создать?" maxWidth={480}>
      <div className="channel-type-option" onClick={()=>{onClose();onCreated('group');}}>
        <div className="channel-type-radio"/>
        <div><div className="channel-type-title"><Icon name="group" size={18} style={{verticalAlign:'middle',marginRight:6}}/>Группа</div><div className="channel-type-desc">Общение участников, роли, права.</div></div>
      </div>
      <div className="channel-type-option" onClick={()=>{onClose();onCreated('channel');}}>
        <div className="channel-type-radio"/>
        <div><div className="channel-type-title"><Icon name="campaign" size={18} style={{verticalAlign:'middle',marginRight:6}}/>Канал</div><div className="channel-type-desc">Публикации, подписчики.</div></div>
      </div>
    </Mdl>
  );
}
function JoinGroupModal({open,onClose,user,profile,onJoined}){
  const [key,setKey]=useState('');
  const [status,setStatus]=useState(null);
  const go=async()=>{
    if(!key.trim())return;
    try{
      const grp=await grpSvc.findByJoinKey(key.trim());
      if(!grp){setStatus({ok:false,msg:'Ключ не найден'});return;}
      if(grp.members?.[user.uid]){setStatus({ok:false,msg:'Уже в группе'});return;}
      await grpSvc.join(grp.id,user.uid,{username:profile.username,avatar:profile.avatar});
      setStatus({ok:true,msg:`Вступили в ${grp.name}`});
      onJoined?.(grp.id);
      setTimeout(onClose,700);
    }catch(e){setStatus({ok:false,msg:e.message});}
  };
  return(
    <Mdl open={open} onClose={onClose} title="Вступить по ключу">
      <input className="input-field" placeholder="Ключ" value={key} onChange={e=>setKey(e.target.value)} style={{fontFamily:'monospace'}}/>
      {status&&<div style={{marginTop:12,padding:12,borderRadius:'var(--r-md)',background:status.ok?'var(--success-soft)':'var(--danger-soft)',color:status.ok?'var(--success)':'var(--danger)',fontSize:13}}>{status.msg}</div>}
      <button className="btn btn-primary btn-full" style={{marginTop:14}} onClick={go}>Вступить</button>
    </Mdl>
  );
}
function FrozenScreen({profile}){
  return(
    <div className="frozen-overlay">
      <div className="frozen-card">
        <div className="frozen-icon">❄️</div>
        <div className="frozen-title">Вы временно заморожены</div>
        <div className="frozen-reason">Причина: {profile.freezeReason||'Не указана'}</div>
        {profile.badges?.SCAM&&<div className="frozen-badge"><Icon name="warning" size={16}/> Значок SCAM выдан</div>}
        <div style={{marginTop:16,color:'var(--t-lo)',fontSize:13}}>Заморозка действует 7 дней с момента выдачи.</div>
      </div>
    </div>
  );
}

/* ===== APP ===== */
function App(){
  const {user,profile,loading}=useAuth();
  const {friends,online}=useFriends(user?.uid);
  const {incoming}=useRequests(user?.uid);
  const groups=useGroups(user?.uid);
  const [activeChat,setActiveChat]=useState(null);
  const [modal,setModal]=useState(null);
  const [profileView,setProfileView]=useState(null);
  const [channelProfile,setChannelProfile]=useState(null);
  const [imageViewer,setImageViewer]=useState(null);
  const [createChoice,setCreateChoice]=useState(null);
  const [blockedUids,setBlockedUids]=useState([]);
  useEffect(()=>{
    if(!user)return;
    const r=db.ref(`blocks/${user.uid}`);
    const h=r.on('value',s=>setBlockedUids(Object.keys(s.val()||{})));
    return()=>r.off('value',h);
  },[user]);
  const chat=useMemo(()=>{
    if(!activeChat)return null;
    if(activeChat.startsWith('group_')){
      const g=groups.find(g=>g.id===activeChat);
      if(!g)return null;
      return{id:g.id,type:g.isChannel?'channel':'group',name:g.name,avatar:g.avatar,uid:g.id};
    }
    const f=friends.find(f=>f.uid===activeChat);
    return f?{id:f.uid,type:'direct',name:f.username,avatar:f.avatar,uid:f.uid}:null;
  },[activeChat,friends,groups]);
  const currentGroup=chat&&chat.type==='group'?groups.find(g=>g.id===chat.id):null;
  const currentChannel=chat&&chat.type==='channel'?groups.find(g=>g.id===chat.id):null;
  const frozen=u.isFrozen(profile);
  if(loading)return<div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;
  if(!user||!profile)return<ConfirmProvider><AuthScreen/></ConfirmProvider>;
  if(frozen)return<ConfirmProvider><FrozenScreen profile={profile}/></ConfirmProvider>;
  const isMobile=window.innerWidth<=768;
  const isSubscribedToChannel=currentChannel&&currentChannel.members&&currentChannel.members[user.uid];
  const handleBlock=async()=>{
    if(!profileView)return;
    if(blockedUids.includes(profileView)){await frSvc.unblock(user.uid,profileView);u.toast('Разблокирован');}
    else{await frSvc.block(user.uid,profileView);u.toast('Заблокирован');}
  };
  return(
    <ConfirmProvider>
      <div className="app">
        <div className="sidebar">
          <ChatList user={user} profile={profile} friends={friends} online={online} groups={groups} activeChat={activeChat} onSelect={c=>{setActiveChat(c.id);setProfileView(null);setChannelProfile(null);}} onCreateGroup={()=>setCreateChoice('choice')} onOpenFriends={()=>setModal('friends')} onJoinGroup={()=>setModal('joinGroup')} onOpenStore={()=>setModal('store')} onOpenSettings={()=>setModal('settings')} onOpenAdmin={()=>setModal('admin')} onOpenStickers={()=>setModal('stickers')} reqCount={incoming.length}/>
        </div>
        <div className="main">
          {profileView?(
            <ProfileView user={user} profile={profile} targetUid={profileView} isOwn={profileView===user.uid} onClose={()=>setProfileView(null)} onWrite={uid=>{setActiveChat(uid);setProfileView(null);}} onBlock={handleBlock} isBlocked={blockedUids.includes(profileView)}/>
          ):channelProfile?(
            <ChannelProfileView channel={channelProfile} user={user} profile={profile} isAdmin={isAdminOf(channelProfile,user.uid)} onClose={()=>setChannelProfile(null)} onOpenSettings={()=>setModal('channelSettings')} isSubscribed={isSubscribedToChannel} onJoin={async()=>{await grpSvc.join(channelProfile.id,user.uid,{username:profile.username,avatar:profile.avatar});u.toast('Подписались');setChannelProfile(null);}} onLeave={async()=>{await grpSvc.leave(channelProfile.id,user.uid);u.toast('Покинули');setChannelProfile(null);}}/>
          ):chat?(
            <ChatView chat={chat} user={user} profile={profile} friends={friends} online={online} blockedUids={blockedUids} onBack={()=>{setActiveChat(null);setProfileView(null);}} onOpenProfile={uid=>{setProfileView(uid);setActiveChat(null);}} onOpenGroupSettings={()=>setModal('groupSettings')} onOpenChannelSettings={()=>setModal('channelSettings')} onOpenChannelProfile={()=>{const g=groups.find(x=>x.id===chat.id);if(g)setChannelProfile(g);}} onOpenImage={setImageViewer}/>
          ):(
            <div className="empty"><Icon name="forum" size={80}/><div className="empty-title">Выберите чат</div></div>
          )}
        </div>
        <CreateModal open={createChoice==='choice'} onClose={()=>setCreateChoice(null)} onCreated={(choice)=>{setCreateChoice(null);if(choice==='group')setModal('createGroup');else setModal('createChannel');}}/>
        <FriendsModal open={modal==='friends'} onClose={()=>setModal(null)} user={user} profile={profile} friends={friends} incoming={incoming} online={online} onOpenProfile={uid=>{setProfileView(uid);setActiveChat(null);}} onWrite={uid=>setActiveChat(uid)}/>
        <CreateGroupModal open={modal==='createGroup'} onClose={()=>setModal(null)} user={user} onCreated={setActiveChat}/>
        <ChannelCreateModal open={modal==='createChannel'} onClose={()=>setModal(null)} user={user} onCreated={setActiveChat}/>
        <JoinGroupModal open={modal==='joinGroup'} onClose={()=>setModal(null)} user={user} profile={profile} onJoined={setActiveChat}/>
        <SettingsModal open={modal==='settings'} onClose={()=>setModal(null)} user={user} profile={profile}/>
        <StoreModal open={modal==='store'} onClose={()=>setModal(null)} user={user} profile={profile}/>
        <StickerPacksModal open={modal==='stickers'} onClose={()=>setModal(null)} user={user}/>
        {currentGroup&&<GroupSettingsModal open={modal==='groupSettings'} onClose={()=>setModal(null)} group={currentGroup} user={user} profile={profile} allFriends={friends} onDeleted={()=>setActiveChat(null)} onLeft={()=>setActiveChat(null)}/>}
        {currentChannel&&<ChannelSettingsModal open={modal==='channelSettings'} onClose={()=>setModal(null)} channel={currentChannel} user={user} profile={profile} allFriends={friends} onDeleted={()=>setActiveChat(null)} onLeft={()=>setActiveChat(null)}/>}
        {userSvc.isAdmin(profile)&&<AdminPanelModal open={modal==='admin'} onClose={()=>setModal(null)} user={user} profile={profile}/>}
        <ImageViewer src={imageViewer} onClose={()=>setImageViewer(null)}/>
        {isMobile&&(<div className="mobile-nav">
          <button className="mobile-nav-item on" onClick={()=>{setActiveChat(null);setProfileView(null);setChannelProfile(null);}}><Icon name="chat"/>Чаты</button>
          <button className="mobile-nav-item" onClick={()=>setModal('friends')}><Icon name="group"/>Друзья{incoming.length>0&&<span className="badge">{incoming.length}</span>}</button>
          <button className="mobile-nav-item" onClick={()=>setModal('store')}><Icon name="storefront"/>Магазин</button>
          <button className="mobile-nav-item" onClick={()=>setModal('settings')}><Icon name="person"/>Профиль</button>
        </div>)}
      </div>
    </ConfirmProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
